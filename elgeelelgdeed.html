<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إحصائيات نظام الامتحانات الإلكترونية - مدرسة الجيل الجديد الخاصة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        /* متغيرات النظام */
        :root {
            --primary: #1a237e;
            --primary-light: #534bae;
            --secondary: #00acc1;
            --success: #00c853;
            --warning: #ff9800;
            --danger: #f44336;
            --info: #2196f3;
            --light: #f5f7fa;
            --dark: #263238;
            --border: #e0e0e0;
            --shadow: 0 8px 30px rgba(0,0,0,0.08);
            --radius: 16px;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* إعادة الضبط */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--dark);
        }

        /* الحاوية الرئيسية */
        .system-container {
            max-width: 1920px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
            min-height: calc(100vh - 40px);
        }

        /* الشريط الجانبي */
        .sidebar {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            border: 1px solid var(--border);
        }

        .logo-section {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 2px solid var(--primary);
        }

        .logo-section h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .logo-section p {
            color: var(--primary-light);
            font-size: 1rem;
            opacity: 0.9;
        }

        .date-selector {
            background: var(--light);
            padding: 20px;
            border-radius: 12px;
            border: 2px dashed var(--border);
        }

        .date-selector input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            text-align: center;
            background: white;
            transition: var(--transition);
        }

        .date-selector input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.1);
        }

        .control-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-btn {
            padding: 18px;
            border: none;
            border-radius: 12px;
            background: var(--light);
            color: var(--dark);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
            border: 2px solid transparent;
        }

        .control-btn:hover {
            transform: translateX(-5px);
            background: white;
            border-color: var(--primary);
            box-shadow: 0 10px 25px rgba(26, 35, 126, 0.15);
        }

        .control-btn.primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
        }

        .control-btn.success {
            background: linear-gradient(135deg, var(--success), #64dd17);
            color: white;
        }

        .control-btn.warning {
            background: linear-gradient(135deg, var(--warning), #ffb300);
            color: white;
        }

        .control-btn.danger {
            background: linear-gradient(135deg, var(--danger), #ef5350);
            color: white;
        }

        .control-btn.info {
            background: linear-gradient(135deg, var(--info), #42a5f5);
            color: white;
        }

        /* المحتوى الرئيسي */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* الهيدر */
        .header {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            border: 1px solid var(--border);
        }

        .header h2 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .header-stat {
            background: var(--light);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid transparent;
            transition: var(--transition);
        }

        .header-stat:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            background: white;
        }

        .header-stat .value {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin: 10px 0;
        }

        .header-stat .label {
            color: var(--primary-light);
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* البطاقات الرئيسية */
        .main-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--light);
        }

        .card-header h3 {
            color: var(--primary);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* الرسوم البيانية */
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }

        /* الجداول */
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        .data-table th {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 18px 20px;
            text-align: right;
            font-weight: 600;
            font-size: 0.95rem;
            position: sticky;
            top: 0;
        }

        .data-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: white;
        }

        .data-table tr:hover td {
            background: var(--light);
        }

        .data-table .badge {
            display: inline-block;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge.success {
            background: rgba(0, 200, 83, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .badge.warning {
            background: rgba(255, 152, 0, 0.1);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .badge.danger {
            background: rgba(244, 67, 54, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .badge.info {
            background: rgba(33, 150, 243, 0.1);
            color: var(--info);
            border: 1px solid var(--info);
        }

        /* نظام النقاط */
        .points-system {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .point-card {
            background: var(--light);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid transparent;
            transition: var(--transition);
        }

        .point-card:hover {
            transform: translateY(-5px);
            background: white;
            border-color: var(--primary);
        }

        .point-card .icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .point-card .value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin: 10px 0;
        }

        /* التعليقات الآلية */
        .comments-section {
            background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
            border-radius: var(--radius);
            padding: 30px;
            margin-top: 25px;
            border-left: 5px solid var(--primary);
        }

        .comment-item {
            padding: 20px;
            background: white;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* الطلاب المتغيبين */
        .absent-students {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .student-item {
            padding: 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }

        .student-item:hover {
            background: var(--light);
            border-radius: 10px;
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .student-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
        }

        /* التحميل */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--light);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* التنبيهات */
        .alert {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 20px 25px;
            border-radius: 12px;
            z-index: 10000;
            min-width: 350px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
            animation: slideIn 0.5s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .alert.success {
            background: linear-gradient(135deg, var(--success), #00e676);
            color: white;
            border-left: 5px solid #00c853;
        }

        .alert.error {
            background: linear-gradient(135deg, var(--danger), #ff5252);
            color: white;
            border-left: 5px solid #f44336;
        }

        .alert.info {
            background: linear-gradient(135deg, var(--info), #40c4ff);
            color: white;
            border-left: 5px solid #2196f3;
        }

        /* النسخ الاحتياطي */
        .backup-section {
            background: linear-gradient(135deg, #fff8e1, #f9fbe7);
            border-radius: var(--radius);
            padding: 30px;
            margin-top: 25px;
            border: 2px dashed var(--warning);
        }

        /* التجاوب */
        @media (max-width: 1200px) {
            .system-container {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                order: 2;
            }
        }

        @media (max-width: 768px) {
            .main-cards {
                grid-template-columns: 1fr;
            }
            
            .header-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .card {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .header-stats {
                grid-template-columns: 1fr;
            }
            
            .alert {
                min-width: 280px;
                right: 10px;
                left: 10px;
            }
        }

        /* أزرار صغيرة */
        .btn-small {
            padding: 8px 15px;
            border-radius: 8px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-small.primary {
            background: var(--primary);
            color: white;
        }

        .btn-small.success {
            background: var(--success);
            color: white;
        }

        .btn-small:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* علامات التبويب */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--light);
            padding-bottom: 15px;
        }

        .tab {
            padding: 12px 25px;
            background: var(--light);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            color: var(--dark);
        }

        .tab.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            box-shadow: 0 5px 15px rgba(26, 35, 126, 0.2);
        }

        .tab:hover:not(.active) {
            background: white;
            border: 2px solid var(--primary);
        }

        /* رسائل النظام */
        .system-message {
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            padding: 20px;
            border-radius: 12px;
            margin: 15px 0;
            border-left: 5px solid var(--success);
            animation: fadeIn 0.5s ease;
        }

        .system-message.warning {
            background: linear-gradient(135deg, #fff3e0, #fbe9e7);
            border-left: 5px solid var(--warning);
        }

        .system-message.error {
            background: linear-gradient(135deg, #ffebee, #fce4ec);
            border-left: 5px solid var(--danger);
        }
    </style>
</head>
<body>
    <div class="system-container">
        <!-- الشريط الجانبي -->
        <div class="sidebar">
            <div class="logo-section">
                <h1><i class="fas fa-school"></i> مدرسة الجيل الجديد الخاصة</h1>
                <p>نظام إحصائيات الامتحانات الإلكترونية</p>
            </div>

            <div class="date-selector">
                <label style="display: block; margin-bottom: 10px; font-weight: 600; color: var(--primary);">
                    <i class="fas fa-calendar-alt"></i> تاريخ الإحصائيات
                </label>
                <input type="date" id="statsDate" value="" onchange="loadDailyStatistics()">
            </div>

            <div class="control-buttons">
                <button class="control-btn primary" onclick="loadAllStatistics(true)">
                    <i class="fas fa-sync-alt"></i>
                    تحديث كامل
                </button>
                <button class="control-btn success" onclick="exportToPDF()">
                    <i class="fas fa-file-pdf"></i>
                    تصدير PDF
                </button>
                <button class="control-btn info" onclick="exportToExcel()">
                    <i class="fas fa-file-excel"></i>
                    تصدير Excel
                </button>
                <button class="control-btn warning" onclick="showRankings()">
                    <i class="fas fa-trophy"></i>
                    الترتيب العام
                </button>
                <button class="control-btn danger" onclick="createBackup()">
                    <i class="fas fa-database"></i>
                    نسخ احتياطي
                </button>
                <button class="control-btn" onclick="showSystemLogs()">
                    <i class="fas fa-history"></i>
                    سجل النظام
                </button>
                <button class="control-btn" onclick="showSettings()">
                    <i class="fas fa-cog"></i>
                    الإعدادات
                </button>
            </div>

            <div style="margin-top: auto; padding-top: 20px; border-top: 2px solid var(--light);">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                    <div style="width: 12px; height: 12px; background: var(--success); border-radius: 50%;"></div>
                    <span style="font-size: 0.9rem;">متصل بقاعدة البيانات</span>
                </div>
                <div style="font-size: 0.8rem; color: var(--primary-light); text-align: center;">
                    آخر تحديث: <span id="lastUpdateTime">--:--</span>
                </div>
            </div>
        </div>

        <!-- المحتوى الرئيسي -->
        <div class="main-content">
            <!-- الهيدر -->
            <div class="header">
                <h2><i class="fas fa-chart-line"></i> الإحصائيات الشاملة</h2>
                <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                    <div class="btn-small primary" onclick="showTodayStats()">اليوم</div>
                    <div class="btn-small" onclick="showWeekStats()">الأسبوع</div>
                    <div class="btn-small" onclick="showMonthStats()">الشهر</div>
                    <div class="btn-small" onclick="showYearStats()">العام</div>
                    <div style="margin-left: auto; display: flex; gap: 10px;">
                        <input type="text" placeholder="بحث..." style="padding: 10px 15px; border: 2px solid var(--border); border-radius: 8px; width: 200px;">
                        <button class="btn-small success"><i class="fas fa-search"></i></button>
                    </div>
                </div>

                <div class="header-stats">
                    <div class="header-stat">
                        <div class="label">إجمالي الطلاب</div>
                        <div class="value" id="totalStudents">0</div>
                        <div style="font-size: 0.8rem; color: var(--primary-light);">من 5 مراحل</div>
                    </div>
                    <div class="header-stat">
                        <div class="label">الحضور اليوم</div>
                        <div class="value" id="todayAttendance">0%</div>
                        <div style="font-size: 0.8rem; color: var(--primary-light);" id="attendedCount">0 طالب</div>
                    </div>
                    <div class="header-stat">
                        <div class="label">المراحل النشطة</div>
                        <div class="value" id="activeGrades">0</div>
                        <div style="font-size: 0.8rem; color: var(--primary-light);">من 5 مراحل</div>
                    </div>
                    <div class="header-stat">
                        <div class="label">أعلى معدل نقاط</div>
                        <div class="value" id="topPoints">0</div>
                        <div style="font-size: 0.8rem; color: var(--primary-light);" id="topStudent">--</div>
                    </div>
                </div>
            </div>

            <!-- علامات التبويب -->
            <div class="tabs">
                <button class="tab active" onclick="showTab('overview')">نظرة عامة</button>
                <button class="tab" onclick="showTab('students')">الطلاب</button>
                <button class="tab" onclick="showTab('grades')">الدرجات</button>
                <button class="tab" onclick="showTab('points')">النقاط</button>
                <button class="tab" onclick="showTab('attendance')">الحضور</button>
                <button class="tab" onclick="showTab('reports')">التقارير</button>
            </div>

            <!-- محتوى علامات التبويب -->
            <div id="tabContent">
                <!-- سيتم ملؤه ديناميكياً -->
            </div>

            <!-- التعليقات الآلية -->
            <div class="comments-section">
                <h3><i class="fas fa-comment-dots"></i> ملاحظات النظام الآلية</h3>
                <div id="autoComments">
                    <!-- سيتم ملؤه ديناميكياً -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

    <script>
        // ========== نظام إدارة الامتحانات المتكامل ==========
        class ExamManagementSystem {
            constructor() {
                // تهيئة Firebase
                this.firebaseConfig = {
                    apiKey: "AIzaSyCtxkYnDVupiJz8iyAzI_oqaZGBaKYYIhY",
                    authDomain: "elgeelelgdeed-1.firebaseapp.com",
                    projectId: "elgeelelgdeed-1",
                    storageBucket: "elgeelelgdeed-1.firebasestorage.app",
                    messagingSenderId: "1031644675136",
                    appId: "1:1031644675136:web:d1acdcfa1530bee72e33a5"
                };
                
                firebase.initializeApp(this.firebaseConfig);
                this.db = firebase.firestore();
                this.auth = firebase.auth();
                
                // المتغيرات العامة
                this.grades = ['6', '7', '8'];
                this.subjects = ['arabic', 'english', 'math', 'science', 'studies'];
                this.weekDays = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday'];
                this.subjectNames = {
                    'arabic': 'عربي',
                    'english': 'إنجليزي',
                    'math': 'رياضيات',
                    'science': 'علوم',
                    'studies': 'دراسات'
                };
                
                // أنظمة التخزين
                this.cache = new Map();
                this.stats = new Map();
                this.backupHistory = [];
                this.systemLogs = [];
                
                // تهيئة النظام
                this.initializeSystem();
            }
            
            // ========== تهيئة النظام ==========
            async initializeSystem() {
                console.log('🚀 تهيئة نظام إدارة الامتحانات...');
                
                try {
                    // إنشاء الكوليكشنات الأساسية إذا لم تكن موجودة
                    await this.createCollectionsIfMissing();
                    
                    // تحميل جدول الامتحانات
                    await this.loadExamSchedule();
                    
                    // تحديث عرض النظام
                    this.updateSystemDisplay();

                    'student_points',    // نقاط الطلاب

                    'system_logs',       // سجل النظام

                    'monthly_rankings',  // الترتيب الشهري
                    'attendance_records' // سجل الحضور
                ];
                
                for (const collection of collections) {
                    try {
                        // محاولة قراءة أول وثيقة لمعرفة إذا كان الكوليكشن موجوداً
                        await this.db.collection(collection).limit(1).get();

                            _system: 'exam-management',
                            _status: 'initialized'
                        });
                        this.logSystem(`تم إنشاء كوليكشن ${collection}`, 'info');
                    }
                }
            }
            
            // ========== نظام النقاط المتطور ==========
            calculatePoints(examData) {
                let points = 0;
                
                // 1. نقاط الدرجات (1 درجة = 1 نقطة)
                points += examData.score || 0;
                
                // 2. نقاط التوقيت
                const submissionTime = new Date(examData.submissionTime);
                const examHour = submissionTime.getHours();
                const examMinute = submissionTime.getMinutes();
                
                // التحويل لساعات مصر
                const cairoHour = (examHour + 2) % 24; // توقيت UTC+2
                
                if (cairoHour === 18) { // 6-7 مساءً
                    points += 5;
                } else if (cairoHour === 19) { // 7-8 مساءً
                    points += 4;
                } else if (cairoHour === 20) { // 8-9 مساءً
                    points += 3;
                } else if (cairoHour === 21) { // 9-10 مساءً
                    points += 2;
                } else if (cairoHour === 22) { // 10-11 مساءً
                    points += 1;
                }
                // بعد 11 مساءً = 0 نقطة
                
                return points;
            }
            
            // ========== تحديث نقاط الطالب ==========
            async updateStudentPoints(studentId, examData) {
                try {
                    const pointsRef = this.db.collection('student_points').doc(studentId);
                    const pointsDoc = await pointsRef.get();
                    
                    const examPoints = this.calculatePoints(examData);
                    const today = new Date().toISOString().split('T')[0];
                    
                    if (pointsDoc.exists) {
                        const data = pointsDoc.data();
                        
                        // تحديث النقاط التراكمية
                        await pointsRef.update({
                            totalPoints: (data.totalPoints || 0) + examPoints,
                            scorePoints: (data.scorePoints || 0) + examData.score,
                            timingPoints: (data.timingPoints || 0) + (examPoints - examData.score),
                            lastExamDate: today,
                            lastSubject: examData.subject,
                            _updatedAt: new Date().toISOString()
                        });
                        
                        // تحديث سلسلة الحضور
                        this.updateAttendanceStreak(studentId, today);
                    } else {
                        // إنشاء سجل جديد
                        await pointsRef.set({
                            studentId: studentId,
                            totalPoints: examPoints,
                            scorePoints: examData.score,
                            timingPoints: examPoints - examData.score,
                            attendancePoints: 0,
                            streakCount: 1,
                            lastExamDate: today,
                            lastSubject: examData.subject,
                            grade: examData.grade,
                            className: examData.className || 'primary',
                            _createdAt: new Date().toISOString(),
                            _updatedAt: new Date().toISOString()
                        });
                    }
                    
                    return examPoints;
                } catch (error) {
                    console.error('خطأ في تحديث النقاط:', error);
                    return 0;
                }
            }
            
            // ========== تحديث سلسلة الحضور ==========
            async updateAttendanceStreak(studentId, examDate) {
                try {
                    const pointsRef = this.db.collection('student_points').doc(studentId);
                    const pointsDoc = await pointsRef.get();
                    
                    if (pointsDoc.exists) {
                        const data = pointsDoc.data();
                        const lastDate = new Date(data.lastExamDate || '2000-01-01');
                        const currentDate = new Date(examDate);
                        
                        // حساب الفرق بالأيام
                        const diffTime = Math.abs(currentDate - lastDate);
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        
                        if (diffDays === 1) {
                            // امتحان متتالي
                            const newStreak = (data.streakCount || 0) + 1;
                            await pointsRef.update({
                                streakCount: newStreak,
                                attendancePoints: this.calculateAttendancePoints(newStreak)
                            });
                        } else if (diffDays > 1) {
                            // كسر السلسلة
                            await pointsRef.update({
                                streakCount: 1,
                                attendancePoints: 0
                            });
                        }
                    }
                } catch (error) {
                    console.error('خطأ في تحديث سلسلة الحضور:', error);
                }
            }
            
            // ========== حساب نقاط الالتزام ==========
            calculateAttendancePoints(streakCount) {
                // كل 5 امتحانات متتالية = 5 نقاط
                return Math.floor(streakCount / 5) * 5;
            }

            // ========== معالجة الإحصائيات اليومية ==========
            processDailyStatistics(students, results, date) {
                const totalStudents = students.length;
                const attemptedStudents = results.length;
                const attendanceRate = totalStudents > 0 ? Math.round((attemptedStudents / totalStudents) * 100) : 0;
                
                // تجميع حسب المرحلة
                const gradeStats = {};
                this.grades.forEach(grade => {
                    const gradeStudents = students.filter(s => s.grade === grade);
                    const gradeResults = results.filter(r => r.grade === grade);
                    
                    gradeStats[grade] = {
                        total: gradeStudents.length,
                        attempted: gradeResults.length,
                        rate: gradeStudents.length > 0 ? Math.round((gradeResults.length / gradeStudents.length) * 100) : 0,
                        subjects: [...new Set(gradeResults.map(r => r.subject))]
                    };
                });
                
                // تجميع حسب المادة
                const subjectStats = {};
                this.subjects.forEach(subject => {
                    const subjectResults = results.filter(r => r.subject === subject);
                    subjectStats[subject] = {
                        total: subjectResults.length,
                        averageScore: subjectResults.length > 0 ? 
                            Math.round(subjectResults.reduce((sum, r) => sum + (r.score || 0), 0) / subjectResults.length) : 0
                    };
                });
                
                // توزيع الدرجات
                const scoreDistribution = {};
                for (let i = 0; i <= 10; i++) {
                    scoreDistribution[i] = results.filter(r => Math.round(r.score) === i).length;
                }
                
                // الطلاب المتغيبين
                const attemptedIds = results.map(r => r.studentId);
                const absentStudents = students.filter(s => !attemptedIds.includes(s.studentId));
                
                // المراحل النشطة (أدت امتحان اليوم)
                const activeGrades = this.grades.filter(grade => {
                    const gradeResults = results.filter(r => r.grade === grade);
                    return gradeResults.length > 0;
                });
                
                return {
                    date: date,
                    totalStudents: totalStudents,
                    attemptedStudents: attemptedStudents,
                    attendanceRate: attendanceRate,
                    gradeStats: gradeStats,
                    subjectStats: subjectStats,
                    scoreDistribution: scoreDistribution,
                    absentStudents: absentStudents,
                    activeGrades: activeGrades,
                    perfectScores: scoreDistribution[10] || 0,
                    timestamp: new Date().toISOString()
                };
            }

                        return this.cache.get(cacheKey);
                    }
                    
                    const studentsSnapshot = await this.db.collection('students').get();
                    const students = studentsSnapshot.docs.map(doc => ({
                        id: doc.id,
                        studentId: doc.data().studentId,
                        fullName: doc.data().fullName || 'غير معروف',
                        grade: doc.data().grade || '6',
                        className: doc.data().className || 'primary',
                        isActive: doc.data().isActive !== false
                    }));
                    
                    // حفظ في الكاش
                    this.cache.set(cacheKey, students);
                    
                    return students;
                } catch (error) {
                    console.error('خطأ في جلب الطلاب:', error);
                    return [];
                }
            }
            
            // ========== جلب نتائج تاريخ معين ==========
            async getExamResultsByDate(date) {
                try {
                    const cacheKey = `results_${date}`;
                    if (this.cache.has(cacheKey)) {
                        return this.cache.get(cacheKey);
                    }
                    
                    const resultsSnapshot = await this.db.collection('exam_results')
                        .where('examDate', '==', date)
                        .get();
                    
                    const results = resultsSnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        submissionTime: doc.data().submissionTime?.toDate() || new Date()
                    }));
                    
                    // حفظ في الكاش
                    this.cache.set(cacheKey, results);
                    
                    return results;
                } catch (error) {

                    return [];
                }

            async createDailyReport(date, stats) {
                try {

                        ...stats,
                        _createdAt: new Date().toISOString(),
                        _system: 'auto-generated'
                    });
                    
                    this.logSystem(`تم إنشاء تقرير يومي لـ ${date}`, 'info');

                }
            }
            
            // ========== إنشاء التعليقات الآلية ==========
            generateAutoComments(stats) {
                const comments = [];
                
                // التعليقات بناءً على الإحصائيات
                if (stats.attendanceRate < 50) {
                    comments.push({
                        type: 'warning',
                        text: `⚠️ نسبة الحضور منخفضة اليوم: ${stats.attendanceRate}% فقط`,
                        icon: 'exclamation-triangle'
                    });
                } else if (stats.attendanceRate >= 90) {
                    comments.push({
                        type: 'success',
                        text: `🎉 نسبة حضور ممتازة اليوم: ${stats.attendanceRate}%`,
                        icon: 'check-circle'
                    });
                }
                
                if (stats.absentStudents?.length > 10) {
                    comments.push({
                        type: 'danger',
                        text: `👥 هناك ${stats.absentStudents.length} طالب متغيب اليوم`,
                        icon: 'user-times'
                    });
                }
                
                if (stats.perfectScores > 0) {
                    comments.push({
                        type: 'info',
                        text: `🏆 ${stats.perfectScores} طالب حصل على الدرجة النهائية اليوم`,
                        icon: 'trophy'
                    });
                }
                
                // عرض التعليقات
                const commentsContainer = document.getElementById('autoComments');
                commentsContainer.innerHTML = comments.map(comment => `
                    <div class="comment-item">
                        <div style="font-size: 1.5em; color: ${comment.type === 'success' ? 'var(--success)' : comment.type === 'warning' ? 'var(--warning)' : 'var(--danger)'};">
                            <i class="fas fa-${comment.icon}"></i>
                        </div>
                        <div style="flex: 1;">
                            ${comment.text}
                        </div>
                        <div style="font-size: 0.8rem; color: var(--primary-light);">
                            ${new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'})}
                        </div>
                    </div>
                `).join('');
                
                if (comments.length === 0) {
                    commentsContainer.innerHTML = `
                        <div class="comment-item">
                            <div style="font-size: 1.5em; color: var(--success);">
                                <i class="fas fa-check-circle"></i>
                            </div>
                            <div style="flex: 1;">
                                كل الأمور تسير على ما يرام اليوم! 👍
                            </div>
                        </div>
                    `;
                }
            }
            
            // ========== تصدير إلى PDF ==========
            async exportToPDF() {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    
                    // عنوان التقرير
                    doc.setFontSize(20);
                    doc.setTextColor(26, 35, 126);
                    doc.text('تقرير إحصائيات الامتحانات الإلكترونية', 105, 20, { align: 'center' });
                    
                    doc.setFontSize(12);
                    doc.setTextColor(128, 128, 128);
                    doc.text(`مدرسة الجيل الجديد الخاصة - ${new Date().toLocaleDateString('ar-EG')}`, 105, 30, { align: 'center' });
                    
                    // إحصائيات رئيسية
                    doc.setFontSize(14);
                    doc.setTextColor(0, 0, 0);
                    doc.text('الإحصائيات الرئيسية:', 20, 50);
                    
                    const stats = this.cache.get(`stats_${new Date().toISOString().split('T')[0]}`) || {};
                    
                    doc.setFontSize(11);
                    doc.text(`• إجمالي الطلاب: ${stats.totalStudents || 0}`, 30, 65);
                    doc.text(`• الحضور اليوم: ${stats.attendanceRate || 0}%`, 30, 75);
                    doc.text(`• الطلاب الحاضرين: ${stats.attemptedStudents || 0}`, 30, 85);
                    doc.text(`• المراحل النشطة: ${stats.activeGrades?.length || 0}/5`, 30, 95);
                    
                    // حفظ الملف
                    doc.save(`exam_report_${new Date().toISOString().split('T')[0]}.pdf`);
                    
                    this.showAlert('تم تصدير التقرير إلى PDF بنجاح', 'success');
                } catch (error) {
                    console.error('خطأ في التصدير:', error);
                    this.showAlert('خطأ في تصدير PDF', 'error');
                }
            }
            
            // ========== تصدير إلى Excel ==========
            async exportToExcel() {
                try {
                    const students = await this.getAllStudents();
                    const today = new Date().toISOString().split('T')[0];
                    const results = await this.getExamResultsByDate(today);
                    
                    // تحضير البيانات
                    const data = students.map(student => {
                        const result = results.find(r => r.studentId === student.studentId);
                        return {
                            'رقم الطالب': student.studentId,
                            'الاسم': student.fullName,
                            'الصف': student.grade,
                            'المرحلة': student.className === 'primary' ? 'ابتدائي' : 'إعدادي',
                            'الحضور اليوم': result ? 'نعم' : 'لا',
                            'الدرجة': result?.score || '--',
                            'المادة': result ? this.subjectNames[result.subject] : '--',
                            'وقت التسليم': result?.submissionTime?.toLocaleTimeString('ar-EG') || '--'
                        };
                    });
                    
                    // إنشاء ورقة عمل
                    const ws = XLSX.utils.json_to_sheet(data);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, 'الطلاب');
                    
                    // حفظ الملف
                    XLSX.writeFile(wb, `students_report_${today}.xlsx`);
                    
                    this.showAlert('تم تصدير البيانات إلى Excel بنجاح', 'success');
                } catch (error) {
                    console.error('خطأ في التصدير:', error);
                    this.showAlert('خطأ في تصدير Excel', 'error');
                }
            }

                        }

                    await this.db.collection('backup_history').doc(backupData.timestamp).set(backupData);
                    
                    this.backupHistory.push(backupData);

            logSystem(message, type = 'info') {

                };
                
                this.systemLogs.push(log);

            showAlert(message, type = 'info') {
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert ${type}`;
                alertDiv.innerHTML = `
                    <div style="font-size: 1.5em;">
                        ${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}

                    <div>${message}</div>
                `;
                
                document.body.appendChild(alertDiv);
                
                setTimeout(() => {
