<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الامتحانات الإلكترونية - مدرسة الجيل الجديد الخاصة</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500&family=Changa:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-dark: #0a1429;
            --primary-blue: #152852;
            --primary-teal: #2a4a7a;
            --primary-light: #3a6cb3;
            --accent-gold: #c9a53d;
            --accent-silver: #a8a8a8;
            --text-light: #f0f0f0;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(-45deg, var(--primary-dark), var(--primary-blue), var(--primary-teal), var(--primary-dark));
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .shape {
            position: absolute;
            opacity: 0.05;
            border-radius: 50%;
            background: var(--accent-gold);
            animation: float 25s infinite linear;
        }
        
        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            left: 80%;
            animation-delay: -5s;
        }
        
        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 80%;
            left: 20%;
            animation-delay: -10s;
        }
        
        .shape:nth-child(4) {
            width: 100px;
            height: 100px;
            top: 30%;
            left: 70%;
            animation-delay: -15s;
        }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(15, 25, 50, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 
                        0 0 0 1px rgba(201, 165, 61, 0.2),
                        inset 0 0 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            animation: shimmer 4s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .title-container {
            margin-bottom: 40px;
            position: relative;
        }
        
        .main-title {
            font-family: 'Amiri', serif;
            font-size: 2.8rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, #f0f0f0, var(--accent-gold), #f0f0f0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(201, 165, 61, 0.4);
            animation: titleGlow 4s ease-in-out infinite alternate;
            position: relative;
            display: inline-block;
            line-height: 1.3;
        }
        
        @keyframes titleGlow {
            0% { text-shadow: 0 0 20px rgba(201, 165, 61, 0.4); }
            100% { text-shadow: 0 0 30px rgba(201, 165, 61, 0.7), 0 0 40px rgba(201, 165, 61, 0.5); }
        }
        
        .subtitle {
            font-size: 1.3rem;
            font-weight: 300;
            color: rgba(240, 240, 240, 0.9);
            letter-spacing: 1px;
        }
        
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
        }
        
        .btn {
            flex: 1;
            min-width: 260px;
            padding: 20px 25px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Changa', sans-serif;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s;
            z-index: -1;
        }
        
        .btn:hover::before {
            transform: translateX(100%);
        }
        
        .btn-admin {
            background: linear-gradient(135deg, #c0392b, #e74c3c, #c0392b);
            color: white;
        }
        
        .btn-teacher {
            background: linear-gradient(135deg, #2980b9, #3498db, #2980b9);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.5), 0 0 12px rgba(255, 255, 255, 0.1);
        }
        
        .btn:active {
            transform: translateY(-2px) scale(1.01);
        }
        
        .btn i {
            font-size: 1.4rem;
            transition: transform 0.3s ease;
        }
        
        .btn:hover i {
            transform: scale(1.2);
        }
        
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }
        
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        
        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 20px;
        }
        
        .modal-content {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-teal));
            padding: 35px 30px;
            border-radius: 18px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 
                        0 0 0 1px rgba(201, 165, 61, 0.3),
                        inset 0 0 15px rgba(0, 0, 0, 0.4);
            transform: scale(0.8) translateY(50px);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
            position: relative;
            overflow: hidden;
        }
        
        .modal-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.05) 50%, transparent 60%);
            z-index: 0;
        }
        
        .modal-title {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: white;
            position: relative;
            z-index: 1;
        }
        
        .password-input-container {
            position: relative;
            margin: 20px 0;
            z-index: 1;
        }
        
        .password-input {
            width: 100%;
            padding: 16px 18px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-family: 'Tajawal', sans-serif;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            color: #333;
        }
        
        .password-input:focus {
            outline: none;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4), 0 0 0 2px var(--accent-gold);
            transform: scale(1.02);
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            z-index: 1;
            position: relative;
        }
        
        .modal-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Changa', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .submit-btn {
            background: linear-gradient(to right, #27ae60, #2ecc71);
            color: white;
        }
        
        .cancel-btn {
            background: linear-gradient(to right, #c0392b, #e74c3c);
            color: white;
        }
        
        .modal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        .modal-btn:active {
            transform: translateY(0);
        }
        
        .footer {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 1rem;
            color: rgba(240, 240, 240, 0.8);
            font-family: 'Changa', sans-serif;
            letter-spacing: 0.5px;
        }
        
        .footer span {
            color: var(--accent-gold);
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                border-radius: 16px;
            }
            
            .main-title {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 1.1rem;
            }
            
            .btn {
                min-width: 100%;
                padding: 18px 20px;
                font-size: 1.1rem;
            }
            
            .modal-content {
                padding: 25px 20px;
            }
            
            .modal-title {
                font-size: 1.6rem;
            }
            
            .password-input {
                padding: 14px 16px;
            }
            
            .modal-btn {
                padding: 12px 20px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 25px 15px;
            }
            
            .main-title {
                font-size: 1.8rem;
            }
            
            .buttons-container {
                gap: 15px;
            }
            
            .btn {
                padding: 16px 18px;
                font-size: 1rem;
            }
            
            .modal-content {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    
    <div class="container" id="mainContainer">
        <div class="title-container">
            <h1 class="main-title">نظام الامتحانات الإلكترونية</h1>
            <h2 class="subtitle">مدرسة الجيل الجديد الخاصة</h2>
        </div>
        
        <div class="buttons-container">
            <button class="btn btn-admin" id="adminBtn">
                <i class="fas fa-school"></i>
                دخول الإدارة المدرسية
            </button>
            <button class="btn btn-teacher" id="teacherBtn">
                <i class="fas fa-chalkboard-teacher"></i>
                دخول المدرس
            </button>
        </div>
        
        <div class="footer">
            برمجة وتصميم <span>مؤسسة اديوتيك ايجيبت</span> المتخصصة في إنشاء الأنظمة
        </div>
    </div>
    
    <!-- نافذة إدخال كلمة المرور -->
    <div class="password-modal" id="passwordModal">
        <div class="modal-content" id="modalContent">
            <h3 class="modal-title" id="modalTitle">إدخال كلمة المرور</h3>
            <div class="password-input-container">
                <input type="password" class="password-input" id="passwordInput" placeholder="أدخل كلمة المرور">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn submit-btn" id="submitPassword">
                    <i class="fas fa-sign-in-alt"></i>
                    دخول
                </button>
                <button class="modal-btn cancel-btn" id="cancelPassword">
                    <i class="fas fa-times"></i>
                    إلغاء
                </button>
            </div>
            <p id="errorMessage" style="color: #ffcccb; margin-top: 20px; display: none; position: relative; z-index: 1;">
                <i class="fas fa-exclamation-circle"></i> كلمة المرور غير صحيحة
            </p>
        </div>
    </div>

    <script>
        let currentPage = '';
        const adminPassword = '1352007';
        
        // تعريف كلمات المرور الخاصة بالمدرسين مع المسارات المعدلة
        const teacherPasswords = {
            // العلوم
            'science4135': 'grades/grade4.science.html',
            'science5135': 'grades/grade5.science.html',
            'science6135': 'grades/grade6.science.html',
            'science7135': 'grades/grade7.science.html',
            'science8135': 'grades/grade8.science.html',
            
            // الرياضيات
            'math4135': 'grades/grade4.math.html',
            'math5135': 'grades/grade5.math.html',
            'math6135': 'grades/grade6.math.html',
            'math7135': 'grades/grade7.math.html',
            'math8135': 'grades/grade8.math.html',
            
            // العربي
            'arabic4135': 'grades/grade4.arabic.html',
            'arabic5135': 'grades/grade5.arabic.html',
            'arabic6135': 'grades/grade6.arabic.html',
            'arabic7135': 'grades/grade7.arabic.html',
            'arabic8135': 'grades/grade8.arabic.html',
            
            // الانجليزي
            'english4135': 'grades/grade4.english.html',
            'english5135': 'grades/grade5.english.html',
            'english6135': 'grades/grade6.english.html',
            'english7135': 'grades/grade7.english.html',
            'english8135': 'grades/grade8.english.html',
            
            // الدراسات
            'studies4135': 'grades/grade4.studies.html',
            'studies5135': 'grades/grade5.studies.html',
            'studies6135': 'grades/grade6.studies.html',
            'studies7135': 'grades/grade7.studies.html',
            'studies8135': 'grades/grade8.studies.html'
        };
        
        // تهيئة الأزرار الرئيسية
        document.getElementById('adminBtn').addEventListener('click', function() {
            openPasswordModal('admin');
        });
        
        document.getElementById('teacherBtn').addEventListener('click', function() {
            openPasswordModal('teacher');
        });
        
        // تهيئة أزرار النافذة المنبثقة
        document.getElementById('submitPassword').addEventListener('click', checkPassword);
        document.getElementById('cancelPassword').addEventListener('click', closePasswordModal);
        
        // تأثير Ripple للأزرار
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.classList.add('ripple');
                
                this.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
        
        function openPasswordModal(pageType) {
            currentPage = pageType;
            const modal = document.getElementById('passwordModal');
            const modalContent = document.getElementById('modalContent');
            
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                modalContent.style.opacity = '1';
                modalContent.style.transform = 'scale(1) translateY(0)';
            }, 10);
            
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMessage').style.display = 'none';
            
            if (pageType === 'admin') {
                document.getElementById('modalTitle').textContent = 'دخول الإدارة المدرسية';
            } else {
                document.getElementById('modalTitle').textContent = 'دخول المدرس';
            }
            
            // تركيز المؤشر على حقل كلمة المرور
            setTimeout(() => {
                document.getElementById('passwordInput').focus();
            }, 300);
        }
        
        function closePasswordModal() {
            const modal = document.getElementById('passwordModal');
            const modalContent = document.getElementById('modalContent');
            
            modal.style.opacity = '0';
            modalContent.style.opacity = '0';
            modalContent.style.transform = 'scale(0.8) translateY(50px)';
            
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }
        
        function checkPassword() {
            const enteredPassword = document.getElementById('passwordInput').value;
            
            if (currentPage === 'admin') {
                if (enteredPassword === adminPassword) {
                    window.location.href = 'elgeelelgdeed.html';
                } else {
                    showError();
                }
            } else if (currentPage === 'teacher') {
                if (teacherPasswords.hasOwnProperty(enteredPassword)) {
                    window.location.href = teacherPasswords[enteredPassword];
                } else {
                    showError();
                }
            }
        }
        
        function showError() {
            document.getElementById('errorMessage').style.display = 'block';
            // تأثير اهتزاز عند إدخال كلمة مرور خاطئة
            const input = document.getElementById('passwordInput');
            input.style.transform = 'translateX(-10px)';
            setTimeout(() => {
                input.style.transform = 'translateX(10px)';
                setTimeout(() => {
                    input.style.transform = 'translateX(0)';
                }, 100);
            }, 100);
        }
        
        // السماح بالضغط على زر Enter لإدخال كلمة المرور
        document.getElementById('passwordInput').addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                checkPassword();
            }
        });
        
        // إغلاق النافذة عند النقر خارجها
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('passwordModal');
            if (event.target === modal) {
                closePasswordModal();
            }
        });
        
        // إضافة تأثيرات للأزرار عند التحميل
        window.addEventListener('load', () => {
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach((button, index) => {
                button.style.opacity = '0';
                button.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    button.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    button.style.opacity = '1';
                    button.style.transform = 'translateY(0)';
                }, 300 + (index * 200));
            });
        });
    </script>
</body>
</html>
